<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vehicle Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f2f5;
    }
    h1 {
      text-align: center;
    }
    ul {
      list-style: none;
      padding: 0;
      max-width: 500px;
      margin: 20px auto;
    }
    li {
      padding: 10px 20px;
      margin: 10px 0;
      background: #fff;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .panel-container {
      display: flex;
      gap: 20px;
      margin: 20px auto;
      flex-wrap: wrap;
      max-width: 1000px;
    }
    .panel {
      flex: 1 1 280px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      min-width: 280px;
    }
    input, select {
      width: 100%;
      padding: 6px 8px;
      margin: 6px 0 12px 0;
      box-sizing: border-box;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    button {
      padding: 8px 16px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    .back-btn {
      display: block;
      margin: 30px auto 0 auto;
      background: #2ecc71;
    }
  </style>
</head>
<body>

  <h1>Vehicle Manager</h1>

  <div id="homePage">
    <ul id="vinList"></ul>
  </div>

  <div id="vinPage" style="display:none;">
    <div class="panel-container">
      <div class="panel"><h2>Vehicle Info</h2><div id="vehicleInfo"></div></div>
      <div class="panel"><h2>Mileage (km)</h2><input type="number" id="mileage" min="0" /></div>
      <div class="panel"><h2>Tyre Pressure (bar)</h2>
        <label>Front Left</label><input type="number" step="0.1" id="tyre_fl" min="0" />
        <label>Front Right</label><input type="number" step="0.1" id="tyre_fr" min="0" />
        <label>Rear Left</label><input type="number" step="0.1" id="tyre_rl" min="0" />
        <label>Rear Right</label><input type="number" step="0.1" id="tyre_rr" min="0" />
      </div>
      <div class="panel" id="fuelPanel"><h2>Fuel Level (%)</h2><input type="number" id="fuel_level" min="0" max="100" /></div>
      <div class="panel" id="batteryPanel"><h2>Battery Level (%)</h2><input type="number" id="battery_level" min="0" max="100" /></div>
      <div class="panel"><h2>Range (km)</h2><input type="number" id="range_km" min="0" /></div>
      <div class="panel"><h2>Consumption (L/100km)</h2><input type="number" step="0.01" id="consumption" min="0" /></div>
      <div class="panel"><h2>Service Status</h2><select id="service_status">
        <option value="">Select</option><option value="Service due">Service due</option><option value="Oil change">Oil change</option><option value="OK">OK</option>
      </select></div>
      <div class="panel"><h2>Coolant Status</h2><select id="coolant_status">
        <option value="">Select</option><option value="OK">OK</option><option value="Warning">Warning</option>
      </select></div>
      <div class="panel"><h2>Windows Status</h2><select id="windows_status">
        <option value="">Select</option><option value="Open">Open</option><option value="Closed">Closed</option>
      </select></div>
      <div class="panel"><h2>Door Status</h2><select id="door_status">
        <option value="">Select</option><option value="Open">Open</option><option value="Closed">Closed</option>
      </select></div>
      <div class="panel"><h2>Door Lock Status</h2><select id="door_lock_status">
        <option value="">Select</option><option value="Locked">Locked</option><option value="Unlocked">Unlocked</option>
      </select></div>
      <!-- Command Override Panel -->
      <div class="panel">
        <h2>Command Overrides</h2>
        <label>Lock Doors</label><select id="lock_doors_override">
          <option value="">No override</option>
          <option value="success">Force Success</option>
          <option value="failed">Force Fail</option>
        </select>
        <label>Unlock Doors</label><select id="unlock_doors_override">
          <option value="">No override</option>
          <option value="success">Force Success</option>
          <option value="failed">Force Fail</option>
        </select>
        <label>Open Windows</label><select id="open_windows_override">
          <option value="">No override</option>
          <option value="success">Force Success</option>
          <option value="failed">Force Fail</option>
        </select>
        <label>Close Windows</label><select id="close_windows_override">
          <option value="">No override</option>
          <option value="success">Force Success</option>
          <option value="failed">Force Fail</option>
        </select>
        <button onclick="saveOverrides()">Save Overrides</button>
      </div>
    </div>

    <button id="updateBtn">Update All Status</button>
    <button class="back-btn" onclick="showHomePage()">Return to Home</button>
  </div>

  <script>
    const apiBase = "http://localhost:8000";

    const vehicles = {
      "WDD2131415161": { type: "Electric Vehicle" },
      "WDD2131415162": { type: "Internal Combustion Engine Vehicle" },
      "WDD2131415163": { type: "Hybrid Electric Vehicle" },
      "WDD2131415164": { type: "Plug-in Hybrid Electric Vehicle" },
      "WDD2131415165": { type: "Fuel Cell Electric Vehicle" }
    };

    const vehicleAssets = {
      "Mercedes": "https://upload.wikimedia.org/wikipedia/commons/9/90/Mercedes-Logo.svg",
      "BMW": "https://upload.wikimedia.org/wikipedia/commons/4/44/BMW.svg",
      "Toyota": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Toyota_carlogo.svg/120px-Toyota_carlogo.svg.png",
      "Ford": "https://upload.wikimedia.org/wikipedia/commons/3/3e/Ford_logo_flat.svg",
      "Hyundai": "https://1000logos.net/wp-content/uploads/2018/03/Hyundai-Logo.png"
    };

    let currentVIN = null;

    function showHomePage() {
      document.getElementById("homePage").style.display = "block";
      document.getElementById("vinPage").style.display = "none";
    }

    function parseNum(id) {
      const val = document.getElementById(id).value;
      return val === "" ? null : Number(val);
    }

    async function saveOverrides() {
      const payload = {
        lock_doors: document.getElementById("lock_doors_override").value || null,
        unlock_doors: document.getElementById("unlock_doors_override").value || null,
        open_windows: document.getElementById("open_windows_override").value || null,
        close_windows: document.getElementById("close_windows_override").value || null
      };
      const res = await fetch(`${apiBase}/${currentVIN}/override`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) alert("Overrides saved successfully.");
      else alert("Failed to save overrides.");
    }

    async function loadOverrides() {
      const res = await fetch(`${apiBase}/${currentVIN}/override`);
      const data = await res.json();
      document.getElementById("lock_doors_override").value = data.lock_doors ?? "";
      document.getElementById("unlock_doors_override").value = data.unlock_doors ?? "";
      document.getElementById("open_windows_override").value = data.open_windows ?? "";
      document.getElementById("close_windows_override").value = data.close_windows ?? "";
    }

    function loadVINList() {
      const vinList = document.getElementById("vinList");
      vinList.innerHTML = "";
      for (const vin in vehicles) {
        const li = document.createElement("li");
        li.textContent = `${vin} (${vehicles[vin].type})`;
        li.onclick = () => loadVINPage(vin);
        vinList.appendChild(li);
      }
    }

    function loadVINPage(vin) {
      currentVIN = vin;
      document.getElementById("homePage").style.display = "none";
      document.getElementById("vinPage").style.display = "block";

      const type = vehicles[vin].type;
      const showFuel = ["Internal Combustion Engine Vehicle", "Hybrid Electric Vehicle", "Plug-in Hybrid Electric Vehicle"].includes(type);
      const showBattery = ["Electric Vehicle", "Hybrid Electric Vehicle", "Plug-in Hybrid Electric Vehicle", "Fuel Cell Electric Vehicle"].includes(type);

      document.getElementById("fuelPanel").style.display = showFuel ? "block" : "none";
      document.getElementById("batteryPanel").style.display = showBattery ? "block" : "none";

      fetch(`${apiBase}/${vin}/status`)
        .then(res => res.json())
        .then(data => {
          document.getElementById("mileage").value = data.mileage ?? "";
          document.getElementById("tyre_fl").value = data.tyre_fl ?? "";
          document.getElementById("tyre_fr").value = data.tyre_fr ?? "";
          document.getElementById("tyre_rl").value = data.tyre_rl ?? "";
          document.getElementById("tyre_rr").value = data.tyre_rr ?? "";
          document.getElementById("fuel_level").value = showFuel ? (data.fuel_level ?? "") : "";
          document.getElementById("battery_level").value = showBattery ? (data.fuel_level ?? "") : "";
          document.getElementById("range_km").value = data.range_km ?? "";
          document.getElementById("consumption").value = data.consumption ?? "";
          document.getElementById("service_status").value = data.service_status ?? "";
          document.getElementById("coolant_status").value = data.coolant_status ?? "";
          document.getElementById("windows_status").value = data.windows_status ?? "";
          document.getElementById("door_status").value = data.door_status ?? "";
          document.getElementById("door_lock_status").value = data.door_lock_status ?? "";
        });

      fetch(`${apiBase}/${vin}/info`)
        .then(res => res.json())
        .then(info => {
          const make = info.Make;
          const logoUrl = vehicleAssets[make] || "https://via.placeholder.com/100?text=Logo";

          const infoHtml = `
            <div style="text-align:center;">
              <img src="${logoUrl}" alt="${make} Logo" style="max-height:60px; margin-bottom:10px;">
            </div>
            <table style="width:100%; border-collapse:collapse;">
              ${Object.entries(info).map(([key, value]) =>
                `<tr>
                  <td style="padding:6px; font-weight:bold; border: 1px solid #ccc;">${key}</td>
                  <td style="padding:6px; border: 1px solid #ccc;">${value}</td>
                </tr>`
              ).join("")}
            </table>
          `;
          document.getElementById("vehicleInfo").innerHTML = infoHtml;
        });

      loadOverrides();
    }

    document.getElementById("updateBtn").onclick = async () => {
      const type = vehicles[currentVIN].type;
      let fuel = null;
      if (["Internal Combustion Engine Vehicle", "Hybrid Electric Vehicle", "Plug-in Hybrid Electric Vehicle"].includes(type)) {
        fuel = parseNum("fuel_level");
      }
      if (["Electric Vehicle", "Hybrid Electric Vehicle", "Plug-in Hybrid Electric Vehicle", "Fuel Cell Electric Vehicle"].includes(type)) {
        fuel = parseNum("battery_level");
      }

      const payload = {
        mileage: parseNum("mileage"),
        tyre_fl: parseNum("tyre_fl"),
        tyre_fr: parseNum("tyre_fr"),
        tyre_rl: parseNum("tyre_rl"),
        tyre_rr: parseNum("tyre_rr"),
        fuel_level: fuel,
        range_km: parseNum("range_km"),
        consumption: parseNum("consumption"),
        service_status: document.getElementById("service_status").value || null,
        coolant_status: document.getElementById("coolant_status").value || null,
        windows_status: document.getElementById("windows_status").value || null,
        door_status: document.getElementById("door_status").value || null,
        door_lock_status: document.getElementById("door_lock_status").value || null,
      };

      const res = await fetch(`${apiBase}/${currentVIN}/status`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (res.ok) alert("Status updated!");
      else alert("Update failed.");
    };

    loadVINList();
    showHomePage();
  </script>
</body>
</html>
